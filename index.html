<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f6f7">
  <link rel="icon" href="data:,">
  <title>能量手账</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <svg class="svg-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 24 24"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol>
  </svg>

  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot"></span>
        <span data-i18n="appName">能量手账</span>
      </div>
      <nav class="tabbar" aria-label="视图" data-i18n-aria="views">
        <button class="tab active" data-view="calendar" data-i18n="tabCalendar">日历</button>
        <button class="tab" data-view="day" data-i18n="tabDay">今日</button>
        <button class="tab" data-view="month" data-i18n="tabMonth">月报</button>
      </nav>
      <button class="btn project-toggle" id="projectToggle" aria-expanded="false" aria-controls="projectPanel">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-folder"></use></svg>
        <span data-i18n="project">项目</span>
        <svg class="icon project-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
      </button>
      <button class="btn lang-toggle" id="langToggle" title="Switch language" aria-label="Switch language">EN</button>
    </header>

    <section class="project-panel" id="projectPanel" hidden>
      <div class="project-panel-head">
        <div class="project-tabs">
          <button type="button" class="project-tab active" data-project-tab="manage" data-i18n="projectManage">管理</button>
          <button type="button" class="project-tab" data-project-tab="timeline" data-i18n="projectTimeline">时间线</button>
        </div>
      </div>
      <div id="projectManageView" class="project-panel-view">
        <div class="project-manage-grid">
          <div id="projectManageList" class="project-manage-list"></div>
          <form id="projectForm" class="project-form">
            <div class="project-add-row">
              <input type="text" id="projectName" maxlength="20" placeholder="新项目" aria-label="新项目" data-i18n-placeholder="newProject">
              <button type="submit" class="btn primary" data-i18n="add">添加</button>
            </div>
            <div class="color-row compact" id="projectColors"></div>
          </form>
        </div>
      </div>
      <div id="projectTimelineView" class="project-panel-view" hidden>
        <div class="timeline-toolbar">
          <select id="timelineProject" class="select-mini" aria-label="选择项目" data-i18n-aria="selectProject"></select>
        </div>
        <div id="projectTimeline" class="project-timeline"></div>
      </div>
    </section>

    <main>
      <section id="calendarView" class="view active">
        <div class="datebar month-datebar">
          <button class="icon-btn" id="calPrevMonth" title="上个月" aria-label="上个月" data-i18n-title="prevMonth" data-i18n-aria="prevMonth">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
          </button>
          <div class="date-title">
            <div class="date-main" id="calendarMonthTitle"></div>
            <div class="date-sub" id="calendarSub"></div>
          </div>
          <button class="icon-btn" id="calNextMonth" title="下个月" aria-label="下个月" data-i18n-title="nextMonth" data-i18n-aria="nextMonth">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
          </button>
        </div>
        <section class="calendar-wrap">
          <div class="calendar-weekdays">
            <span data-i18n="weekdayMon">一</span>
            <span data-i18n="weekdayTue">二</span>
            <span data-i18n="weekdayWed">三</span>
            <span data-i18n="weekdayThu">四</span>
            <span data-i18n="weekdayFri">五</span>
            <span data-i18n="weekdaySat">六</span>
            <span data-i18n="weekdaySun">日</span>
          </div>
          <div id="calendarGrid" class="calendar-grid"></div>
        </section>
        <div class="calendar-legend">
          <span class="legend-item"><span class="legend-swatch today-swatch"></span><span data-i18n="today">今天</span></span>
          <span class="legend-item"><span class="legend-swatch data-swatch"></span><span data-i18n="hasRecord">有记录</span></span>
          <span class="legend-item"><span class="legend-swatch over-swatch"></span><span data-i18n="overLimit">超支</span></span>
        </div>
      </section>

      <section id="dayView" class="view">
        <div class="datebar">
          <button class="icon-btn" id="prevDay" title="前一天" aria-label="前一天" data-i18n-title="prevDay" data-i18n-aria="prevDay">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
          </button>
          <button class="today-btn" id="todayBtn" data-i18n="today">今天</button>
          <div class="date-title">
            <div class="date-main" id="dateMain"></div>
            <div class="date-sub" id="dateSub"></div>
          </div>
          <button class="icon-btn" id="nextDay" title="后一天" aria-label="后一天" data-i18n-title="nextDay" data-i18n-aria="nextDay">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
          </button>
        </div>

        <section class="energy-band" id="energySection" aria-label="今日能量" data-i18n-aria="todayEnergy">
          <button type="button" class="energy-toggle" id="energyToggle" aria-expanded="false" aria-controls="energySettings">
            <span class="energy-label" id="energyLabel" data-i18n="netSpend">净消耗</span>
            <span class="energy-num">
              <strong id="energyInvested">0</strong>
              <span>/ <span id="energyCap">100</span></span>
            </span>
            <span class="energy-segments" id="energySegments"></span>
            <svg class="icon energy-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chevron-down"></use></svg>
          </button>
          <div class="energy-settings" id="energySettings" hidden>
            <div class="energy-settings-row">
              <span data-i18n="energyCap">能量上限</span>
              <input type="range" id="capSlider" min="20" max="200" step="5" value="100">
              <output id="capValue" for="capSlider">100</output>
            </div>
            <div class="energy-settings-foot">
              <span id="energyUsedText">已投入 0</span>
              <span id="energyTasksText">完成任务 0</span>
            </div>
          </div>
        </section>

        <section class="section tasks-section">
          <div class="section-head">
            <div class="section-title">
              <span class="section-icon tasks-icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-list"></use></svg>
              </span>
               <span data-i18n="tasks">待办</span>
            </div>
            <div class="head-actions">
              <select id="projectFilter" class="select-mini" aria-label="按项目筛选" data-i18n-aria="filterProject">
              </select>
              <button class="btn primary task-add" id="addTaskBtn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-plus"></use></svg>
                <span data-i18n="tasks">待办</span>
              </button>
            </div>
          </div>
          <div id="taskList" class="task-list"></div>
        </section>

        <section class="section mood-section">
          <div class="section-head">
            <div class="section-title">
              <span class="section-icon mood-icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-heart"></use></svg>
              </span>
              <span data-i18n="mood">心情</span>
            </div>
          </div>
          <label class="field mood-summary-field">
            <span data-i18n="moodSummaryLabel">今日心情小结</span>
            <input type="text" id="moodSummary" maxlength="80" placeholder="写一句今天的心情..." data-i18n-placeholder="moodSummaryPlaceholder">
          </label>
          <div id="moodPicker" class="mood-picker"></div>
          <div id="moodLogList" class="mood-log-list"></div>
        </section>

        <section class="section diary-section">
          <div class="section-head">
            <div class="section-title">
              <span class="section-icon diary-icon">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-pen"></use></svg>
              </span>
              <span data-i18n="diary">日记 · 备忘</span>
            </div>
            <div class="head-actions">
              <button class="btn ghost" id="summaryBtn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-check"></use></svg>
                <span data-i18n="recordCompleted">记录完成项</span>
              </button>
              <button class="btn primary diary-add" id="addMemoBtn">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-plus"></use></svg>
                <span data-i18n="memo">备忘</span>
              </button>
            </div>
          </div>
          <div class="template-row">
            <button class="template-chip praise" id="praiseBtn">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-sparkles"></use></svg>
              <span data-i18n="praise">今日夸夸</span>
            </button>
            <button class="template-chip gratitude" id="gratitudeBtn">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-heart"></use></svg>
              <span data-i18n="gratitude">今日感恩</span>
            </button>
            <button class="template-chip reflection" id="reflectionBtn">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-moon"></use></svg>
              <span data-i18n="reflection">今日反思</span>
            </button>
          </div>
          <div id="memoList" class="memo-list"></div>
        </section>
      </section>

      <section id="monthView" class="view">
        <div class="datebar month-datebar">
          <button class="icon-btn" id="prevMonth" title="上个月" aria-label="上个月" data-i18n-title="prevMonth" data-i18n-aria="prevMonth">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
          </button>
          <div class="date-title">
            <div class="date-main" id="monthTitle"></div>
            <div class="date-sub" data-i18n="monthSub">每日上限与消耗</div>
          </div>
          <button class="icon-btn" id="nextMonth" title="下个月" aria-label="下个月" data-i18n-title="nextMonth" data-i18n-aria="nextMonth">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-chevron-right"></use></svg>
          </button>
        </div>

        <section class="stats-band">
          <div class="stat">
            <strong id="statTasks">0</strong>
            <span data-i18n="statTasks">完成任务</span>
          </div>
          <div class="stat">
            <strong id="statEnergy">0</strong>
            <span data-i18n="statSpend">消耗能量</span>
          </div>
          <div class="stat">
            <strong id="statRecovered">0</strong>
            <span data-i18n="statRecover">恢复能量</span>
          </div>
          <div class="stat">
            <strong id="statDays">0</strong>
            <span data-i18n="statDays">记录天数</span>
          </div>
          <div class="stat">
            <strong id="statAvgCap">100</strong>
            <span data-i18n="statAvgCap">平均上限</span>
          </div>
        </section>

        <section class="chart-wrap">
          <div class="chart-title" data-i18n="chartTitle">每日能量 × 心情</div>
          <div class="legend">
            <span class="legend-item"><span class="legend-swatch dash"></span><span data-i18n="energyCap">能量上限</span></span>
            <span class="legend-item"><span class="legend-swatch spend"></span><span data-i18n="spend">消耗</span></span>
            <span class="legend-item"><span class="legend-swatch recover"></span><span data-i18n="recover">恢复</span></span>
          </div>
          <div id="moodMonthStats" class="mood-month-stats"></div>
          <svg id="energyChart" viewBox="0 0 700 260" role="img" aria-label="每日能量上限与实际消耗折线图" data-i18n-aria="chartAria"></svg>
          <div id="chartEmpty" class="empty-note" hidden data-i18n="monthEmpty">这个月还没有记录</div>
        </section>
      </section>
    </main>
  <div class="modal-backdrop" id="taskModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle">
      <div class="modal-head">
        <h2 id="taskModalTitle" data-i18n="newTask">新待办</h2>
        <button class="icon-btn modal-close" data-close="taskModal" aria-label="关闭" data-i18n-aria="close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <form id="taskForm">
        <label class="field">
          <span data-i18n="task">任务</span>
          <input type="text" id="taskTitle" maxlength="80" placeholder="写点什么" required data-i18n-placeholder="taskPlaceholder">
        </label>
        <div class="field-row">
          <label class="field">
            <span data-i18n="project">项目</span>
            <select id="taskProject"></select>
          </label>
          <label class="field">
            <span data-i18n="priority">优先级</span>
            <div class="segmented" id="taskPriority">
              <button type="button" data-value="0" data-i18n="priorityLow">低</button>
              <button type="button" data-value="1" class="active" data-i18n="priorityMedium">中</button>
              <button type="button" data-value="2" data-i18n="priorityHigh">高</button>
            </div>
          </label>
        </div>
        <label class="field">
          <span data-i18n="energyDirection">能量方向</span>
          <div class="segmented" id="taskEnergyType">
            <button type="button" data-energy-type="spend" class="active" data-i18n="spend">消耗</button>
            <button type="button" data-energy-type="recover" data-i18n="recover">恢复</button>
          </div>
        </label>
        <label class="field">
          <span data-i18n="energyAmount">所需能量</span>
          <div class="slider-row">
            <input type="range" id="taskEnergy" min="5" max="100" step="5" value="10">
            <output id="taskEnergyValue" for="taskEnergy">10</output>
          </div>
        </label>
        <label class="field">
          <span data-i18n="note">备注</span>
          <textarea id="taskNote" rows="3" placeholder="可留空" data-i18n-placeholder="optional"></textarea>
        </label>
        <div class="modal-foot">
          <button type="button" class="btn ghost" id="deleteTaskBtn" hidden data-i18n="delete">删除</button>
          <button type="submit" class="btn primary task-add" data-i18n="save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="memoModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="memoModalTitle">
      <div class="modal-head">
        <h2 id="memoModalTitle" data-i18n="newMemo">新备忘</h2>
        <button class="icon-btn modal-close" data-close="memoModal" aria-label="关闭" data-i18n-aria="close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <form id="memoForm">
        <label class="field">
          <span data-i18n="memo">备忘</span>
          <textarea id="memoText" rows="6" required></textarea>
        </label>
        <label class="field">
          <span data-i18n="type">类型</span>
          <div class="kind-chips" id="memoKindChips"></div>
        </label>
        <div class="modal-foot">
          <button type="submit" class="btn primary diary-add" data-i18n="save">保存</button>
        </div>
      </form>
    </div>
  </div>

  <div class="modal-backdrop" id="moodLogModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="moodLogTitle">
      <div class="modal-head">
        <h2 id="moodLogTitle" data-i18n="recordMood">记录此刻心情</h2>
        <button class="icon-btn modal-close" data-close="moodLogModal" aria-label="关闭" data-i18n-aria="close">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-x"></use></svg>
        </button>
      </div>
      <div class="mood-log-emoji" id="moodLogEmoji"></div>
      <label class="field">
        <span data-i18n="note">备注</span>
        <textarea id="moodLogNote" rows="3" placeholder="可留空" data-i18n-placeholder="optional"></textarea>
      </label>
      <label class="field">
        <span data-i18n="associate">关联</span>
        <select id="moodLogAssociate"></select>
      </label>
      <div class="modal-foot">
        <button type="button" class="btn ghost" id="moodLogDelete" hidden data-i18n="delete">删除</button>
        <button type="button" class="btn primary" id="moodLogSave" data-i18n="save">保存</button>
      </div>
    </div>
  </div>

  <button class="floating-mood" id="floatingMoodBtn" hidden>
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#i-heart"></use></svg>
    <span data-i18n="mood">心情</span>
  </button>

  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
